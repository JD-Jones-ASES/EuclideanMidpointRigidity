version: v0.4
project:
  name: Euclidean midpoint rigidity in every finite dimension
  description: >-
    Let a smooth symmetric cubic tensor on a connected open subset of Euclidean
    space define two dual connections by adding and subtracting its raised
    tensor from the Euclidean connection. If the two canonical geodesic
    midpoints have the same arithmetic mean as their endpoints for all nearby
    pairs at every point, the cubic tensor is constant throughout the domain.
    This proves Nielsen–Okamura Conjecture 9.1 in every finite dimension.
  authors: [JD Jones]
  responsible_maintainers: [JD Jones]
  license: MIT
classification:
  arxiv: [math.DG]
  msc2020: ["53B12"]
sources:
  - title: Euclidean midpoint rigidity in every finite dimension
    type: original-proof
    relationship: other
    location: Proof.md
    note: This development supplies the general-dimensional necessity proof.
  - title: Dual-connection midpoint matrix means and their Gauss composition
    authors: [Frank Nielsen, Kazuki Okamura]
    type: paper
    id: https://arxiv.org/abs/2609.07551v2
    location: Section 9, Conjecture 9.1 and Theorems 9.2–9.3
    relationship: background
    note: The paper poses the conjecture, derives a fourth-order obstruction and proves the scalar-multiple case.
related_formalizations:
  - id: https://github.com/JD-Jones-ASES/PlanarMidpoint/tree/f277b89a3b0db20872101fd61580ecced748e7c1
    relationship: adapts
    note: >-
      The earlier formalization proves the two-dimensional case. This development
      adapts its short-geodesic construction and fourth-order expansion. The
      sixth-order analysis and the reduction to a smaller orthogonal factor
      enter the proof in general dimension.
