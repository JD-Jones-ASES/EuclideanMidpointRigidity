review:
  status: self-assessed
  notes: The formalizing agent compared the statement and its hypotheses with Section 9. The proof has not received external human peer review.
fidelity:
  divergences: >-
    Euclidean index raising represents a symmetric cubic by a commutative bilinear product
    with self-adjoint multiplication. The neighborhood-of-the-diagonal hypothesis is
    stated locally at each point using the unique short geodesic for each endpoint pair.
